<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tri Ân & Chúc Mừng 20/10</title>
    <style>
        :root {
            --primary-color: #f43f5e;
            --accent-color: #fb7185;
            --bg-color: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas hoa rơi & pháo hoa */
        #effects-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Khung Video Player */
        .video-container {
            width: 90%;
            max-width: 800px;
            height: 500px;
            background: linear-gradient(135deg, #1e1b4b 0%, #31103f 50%, #4c0519 100%);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(244, 63, 94, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid rgba(251, 113, 133, 0.3);
        }

        /* Màn hình khởi động (Start Screen) */
        .overlay-start {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .play-btn-big {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.6);
            transition: all 0.3s;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .play-btn-big:hover {
            transform: scale(1.1);
            box-shadow: 0 0 45px rgba(244, 63, 94, 0.9);
        }

        /* Khu vực hiển thị Slide Video */
        .slide-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 30px;
            position: relative;
        }

        .slide {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            animation: zoomFade 1s ease-in-out;
        }

        .slide.active {
            display: flex;
        }

        .slide-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .slide-title {
            font-size: 2.2rem;
            color: #fecdd3;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
        }

        .slide-text {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #f3f4f6;
            max-width: 650px;
            font-style: italic;
            min-height: 80px;
        }

        /* Thanh điều khiển Video (Player Controls) */
        .controls-bar {
            height: 70px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #fb7185, #f43f5e);
            transition: width 0.1s linear;
        }

        .controls-btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .btn-control {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.2s;
        }

        .btn-control:hover {
            color: var(--accent-color);
        }

        .slide-counter {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Custom Tên người nhận */
        .custom-name-box {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            z-index: 25;
        }

        .custom-name-box input {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            text-align: center;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes zoomFade {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 600px) {
            .video-container { height: 450px; }
            .slide-title { font-size: 1.6rem; }
            .slide-text { font-size: 1rem; }
            .slide-icon { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="effects-canvas"></canvas>

    <div class="video-container">

        <!-- Màn hình Play ban đầu -->
        <div class="overlay-start" id="startOverlay">
            <div class="play-btn-big" onclick="startVideo()">▶</div>
            <h2 style="color: #fecdd3; margin-bottom: 10px;">VIDEO TRUYỀN TẢI YÊU THƯƠNG 20/10</h2>
            <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 15px;">Nhấn Phát để bắt đầu xem video cùng âm nhạc du dương</p>
            
            <div class="custom-name-box">
                <input type="text" id="nameInput" value="Mẹ Yêu / Phụ Nữ Việt Nam" placeholder="Nhập tên người nhận...">
            </div>
        </div>

        <!-- Các Cảnh (Slides) trong Video -->
        <div class="slide-screen">

            <!-- Cảnh 1 -->
            <div class="slide active" data-duration="6">
                <div class="slide-icon">💐</div>
                <div class="slide-title">GỬI NGƯỜI PHỤ NỮ TÔI YÊU</div>
                <div class="slide-text" id="typewriter1"></div>
            </div>

            <!-- Cảnh 2 -->
            <div class="slide" data-duration="7">
                <div class="slide-icon">👑</div>
                <div class="slide-title">TÔN VINH VẺ ĐẸP & SỰ HY SINH</div>
                <div class="slide-text" id="typewriter2"></div>
            </div>

            <!-- Cảnh 3 -->
            <div class="slide" data-duration="7">
                <div class="slide-icon">✨</div>
                <div class="slide-title">LỜI CHÚC NGỌT NGÀO NHẤT</div>
                <div class="slide-text" id="typewriter3"></div>
            </div>

            <!-- Cảnh 4 -->
            <div class="slide" data-duration="8">
                <div class="slide-icon">🌹</div>
                <div class="slide-title">HAPPY WOMEN'S DAY 20/10</div>
                <div class="slide-text" id="typewriter4"></div>
            </div>

        </div>

        <!-- Thanh điều khiển Video -->
        <div class="controls-bar">
            <div class="progress-container" onclick="seekVideo(event)">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="controls-btn-group">
                <div>
                    <button class="btn-control" onclick="togglePlayPause()" id="playPauseBtn">⏸</button>
                    <button class="btn-control" onclick="restartVideo()">🔄</button>
                </div>
                <div class="slide-counter" id="slideCounter">Cảnh 1 / 4</div>
                <button class="btn-control" onclick="toggleSound()" id="soundBtn">🔊</button>
            </div>
        </div>

    </div>

    <script>
        // --- 1. DỮ LIỆU CÁC CẢNH TRONG VIDEO ---
        let currentSlide = 0;
        let isPlaying = false;
        let isSoundOn = true;
        let progressInterval = null;
        let currentTime = 0;
        let totalDuration = 28; // Tổng số giây video

        const slideTexts = [
            "Nhân ngày Phụ nữ Việt Nam 20/10, xin gửi trọn vẹn sự trân trọng và tình yêu thương chân thành nhất...",
            "Cảm ơn vì những hy sinh thầm lặng, sự ân cần và nụ cười rạng rỡ luôn sưởi ấm tâm hồn chúng con/anh...",
            "Chúc cho nửa thế giới luôn mạnh khỏe, tràn đầy niềm vui, luôn tỏa sáng và gặt hái thật nhiều hạnh phúc!",
            "Mong rằng mọi ngày trong năm đều là những ngày tràn ngập hoa, quà và tình yêu thương dành cho bạn!"
        ];

        const slides = document.querySelectorAll('.slide');
        const progressBar = document.getElementById('progressBar');

        function startVideo() {
            document.getElementById('startOverlay').style.display = 'none';
            isPlaying = true;
            playMelody();
            runVideo();
            showSlide(0);
        }

        function showSlide(index) {
            slides.forEach((s, i) => {
                s.classList.remove('active');
                if (i === index) s.classList.add('active');
            });

            currentSlide = index;
            document.getElementById('slideCounter').innerText = `Cảnh ${index + 1} / ${slides.length}`;
            
            // Chạy hiệu ứng đánh máy chữ
            const targetName = document.getElementById('nameInput').value || "Người Phụ Nữ Tôi Yêu";
            let text = slideTexts[index];
            if (index === 0) text = `Gửi ${targetName}! ` + text;
            typeWriter(`typewriter${index + 1}`, text);
        }

        function runVideo() {
            if (progressInterval) clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                if (!isPlaying) return;

                currentTime += 0.1;
                const percent = (currentTime / totalDuration) * 100;
                progressBar.style.width = `${percent}%`;

                // Chuyển cảnh theo mốc thời gian
                if (currentTime >= 7 && currentSlide === 0) showSlide(1);
                else if (currentTime >= 14 && currentSlide === 1) showSlide(2);
                else if (currentTime >= 21 && currentSlide === 2) showSlide(3);
                else if (currentTime >= totalDuration) {
                    currentTime = 0;
                    showSlide(0);
                }
            }, 100);
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            document.getElementById('playPauseBtn').innerText = isPlaying ? '⏸' : '▶';
        }

        function restartVideo() {
            currentTime = 0;
            isPlaying = true;
            document.getElementById('playPauseBtn').innerText = '⏸';
            showSlide(0);
        }

        function seekVideo(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            currentTime = pos * totalDuration;
            
            if (currentTime < 7) showSlide(0);
            else if (currentTime < 14) showSlide(1);
            else if (currentTime < 21) showSlide(2);
            else showSlide(3);
        }

        // Hiệu ứng Typewriter
        function typeWriter(elementId, text) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerText = '';
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    el.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 40);
        }

        // --- 2. CANVAS HIỆU ỨNG NỀN (HOA & PHÁO HOA) ---
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const icons = ['🌹', '🌸', '💖', '✨', '🌺'];

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 18 + 12,
                vy: Math.random() * 1.5 + 0.8,
                vx: Math.random() * 1 - 0.5,
                icon: icons[Math.floor(Math.random() * icons.length)],
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;
                if (p.y > height) {
                    p.y = -20;
                    p.x = Math.random() * width;
                }
                ctx.font = `${p.size}px serif`;
                ctx.globalAlpha = p.opacity;
                ctx.fillText(p.icon, p.x, p.y);
            });
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // --- 3. ÂM THANH NHẠC NỀN DU DƯƠNG ---
        let audioCtx = null;
        let musicTimer = null;

        function playMelody() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const notes = [261.63, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
            musicTimer = setInterval(() => {
                if (!isPlaying || !isSoundOn) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];

                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            }, 500);
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('soundBtn').innerText = isSoundOn ? '🔊' : '🔇';
        }
    </script>
</body>
</html>
